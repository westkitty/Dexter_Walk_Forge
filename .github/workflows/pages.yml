name: Pages / PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify Dexter Walk Forge
        run: node verify.mjs
      - name: Verify Timeforge
        run: node timeforge-verify.mjs
      - name: Verify PWA source
        run: node pwa-verify.mjs
      - name: Build Pages artifact
        run: node scripts/build-pages.mjs
      - name: Verify Pages artifact
        run: node pwa-verify.mjs --site _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
